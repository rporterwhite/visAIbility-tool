<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisAIbility Tool - Track Your Brand's AI Visibility</title>
  <meta name="description" content="Free tool to track your brand's visibility across AI platforms like ChatGPT, Claude, Perplexity, and Google AI Overviews">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

    // Lucide React icons as inline SVG components
    const Plus = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
      </svg>
    );

    const Trash2 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const Download = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const TrendingUp = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );

    const BarChart3 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    );

    function VisAIbilityTool() {
      const [screen, setScreen] = useState('projects');
      const [projects, setProjects] = useState([]);
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [editingPrompt, setEditingPrompt] = useState(null);
      
      const [newProject, setNewProject] = useState({
        name: '',
        brandName: '',
        productDescription: '',
        industry: 'fashion',
        competitors: ['', '', '']
      });

      const [currentLog, setCurrentLog] = useState({
        date: new Date().toISOString().split('T')[0],
        platform: '',
        promptId: null,
        response: '',
        mentions: {}
      });

      useEffect(() => {
        const saved = localStorage.getItem('visaibility-projects');
        if (saved) {
          const data = JSON.parse(saved);
          setProjects(data.projects || []);
          setCurrentProjectId(data.currentProjectId || null);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('visaibility-projects', JSON.stringify({
          projects,
          currentProjectId
        }));
      }, [projects, currentProjectId]);

      const currentProject = projects.find(p => p.id === currentProjectId);

      const createProject = () => {
        const project = {
          id: Date.now(),
          name: newProject.name,
          brandName: newProject.brandName,
          productDescription: newProject.productDescription,
          industry: newProject.industry,
          competitors: newProject.competitors.filter(c => c.trim()),
          prompts: generateInitialPrompts(newProject),
          logs: [],
          createdAt: new Date().toISOString()
        };
        
        setProjects([...projects, project]);
        setCurrentProjectId(project.id);
        setNewProject({
          name: '',
          brandName: '',
          productDescription: '',
          industry: 'fashion',
          competitors: ['', '', '']
        });
        setScreen('prompts');
      };

      const generateInitialPrompts = (projectData) => {
        const { brandName, productDescription, competitors } = projectData;
        const product = productDescription || 'products';
        const comp = competitors.find(c => c.trim());
        
        return [
          {
            id: 1,
            text: `What are the best ${product} to buy online?`,
            category: 'general',
            isCustom: false
          },
          {
            id: 2,
            text: comp 
              ? `Compare ${brandName} to ${comp} for ${product}`
              : `What makes ${brandName} different from other ${product} brands?`,
            category: 'brand-specific',
            isCustom: false
          },
          {
            id: 3,
            text: `Which brands are known for high-quality ${product}?`,
            category: 'general',
            isCustom: false
          },
          {
            id: 4,
            text: `What do experts recommend for ${product}?`,
            category: 'general',
            isCustom: false
          },
          {
            id: 5,
            text: `What are the most popular ${product} brands in 2025?`,
            category: 'general',
            isCustom: false
          }
        ];
      };

      const addCustomPrompt = (promptText) => {
        if (!currentProject || !promptText.trim()) return;
        
        const newPrompt = {
          id: Date.now(),
          text: promptText,
          category: 'custom',
          isCustom: true
        };
        
        const updatedProjects = projects.map(p => 
          p.id === currentProjectId 
            ? { ...p, prompts: [...p.prompts, newPrompt] }
            : p
        );
        
        setProjects(updatedProjects);
      };

      const updatePrompt = (promptId, newText) => {
        const updatedProjects = projects.map(p => 
          p.id === currentProjectId 
            ? { 
                ...p, 
                prompts: p.prompts.map(pr => 
                  pr.id === promptId ? { ...pr, text: newText } : pr
                )
              }
            : p
        );
        
        setProjects(updatedProjects);
        setEditingPrompt(null);
      };

      const deletePrompt = (promptId) => {
        const updatedProjects = projects.map(p => 
          p.id === currentProjectId 
            ? { ...p, prompts: p.prompts.filter(pr => pr.id !== promptId) }
            : p
        );
        
        setProjects(updatedProjects);
      };

      const deleteProject = (projectId) => {
        setProjects(projects.filter(p => p.id !== projectId));
        if (currentProjectId === projectId) {
          setCurrentProjectId(null);
          setScreen('projects');
        }
      };

      const parseMentions = (response) => {
        if (!currentProject) return {};
        
        const text = response.toLowerCase();
        const allBrands = [currentProject.brandName, ...currentProject.competitors];
        const mentions = {};
        
        allBrands.forEach(brand => {
          const brandLower = brand.toLowerCase();
          const regex = new RegExp(brandLower, 'gi');
          const matches = text.match(regex);
          mentions[brand] = matches ? matches.length : 0;
        });

        return mentions;
      };

      const addLog = () => {
        if (!currentProject || !currentLog.response) return;
        
        const mentions = parseMentions(currentLog.response);
        const prompt = currentProject.prompts.find(p => p.id === currentLog.promptId);
        
        const newLog = {
          ...currentLog,
          mentions,
          id: Date.now(),
          promptText: prompt?.text || ''
        };

        const updatedProjects = projects.map(p => 
          p.id === currentProjectId 
            ? { ...p, logs: [...p.logs, newLog] }
            : p
        );
        
        setProjects(updatedProjects);
        
        setCurrentLog({
          date: new Date().toISOString().split('T')[0],
          platform: '',
          promptId: currentProject.prompts[0]?.id || null,
          response: '',
          mentions: {}
        });
      };

      const getDashboardData = () => {
        if (!currentProject || currentProject.logs.length === 0) return null;
        
        const byDate = currentProject.logs.reduce((acc, log) => {
          if (!acc[log.date]) {
            acc[log.date] = { date: log.date };
          }
          Object.entries(log.mentions).forEach(([brand, count]) => {
            acc[log.date][brand] = (acc[log.date][brand] || 0) + count;
          });
          return acc;
        }, {});

        const byPlatform = currentProject.logs.reduce((acc, log) => {
          if (!acc[log.platform]) {
            acc[log.platform] = { platform: log.platform };
          }
          Object.entries(log.mentions).forEach(([brand, count]) => {
            acc[log.platform][brand] = (acc[log.platform][brand] || 0) + count;
          });
          return acc;
        }, {});

        return {
          timeline: Object.values(byDate).sort((a, b) => new Date(a.date) - new Date(b.date)),
          platforms: Object.values(byPlatform)
        };
      };

      const exportData = () => {
        if (!currentProject) return;
        
        const allBrands = [currentProject.brandName, ...currentProject.competitors];
        const headers = ['Date', 'Platform', 'Prompt', ...allBrands].join(',');
        const rows = currentProject.logs.map(log => {
          return [
            log.date,
            log.platform,
            `"${log.promptText}"`,
            ...allBrands.map(brand => log.mentions[brand] || 0)
          ].join(',');
        });

        const csv = [headers, ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentProject.name.replace(/\s+/g, '-')}-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      const exportAllData = () => {
        const dataToExport = {
          version: '1.0',
          exportDate: new Date().toISOString(),
          projects: projects
        };
        
        const json = JSON.stringify(dataToExport, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `visaibility-backup-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      const importData = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            
            if (!imported.projects || !Array.isArray(imported.projects)) {
              alert('Invalid backup file format');
              return;
            }

            const shouldReplace = confirm(
              `This will import ${imported.projects.length} project(s).\n\n` +
              `Current projects: ${projects.length}\n\n` +
              `Click OK to ADD these projects to your existing ones.\n` +
              `Click Cancel to abort.`
            );

            if (shouldReplace) {
              setProjects([...projects, ...imported.projects]);
              alert('Projects imported successfully!');
            }
          } catch (error) {
            alert('Error reading backup file. Please make sure it\'s a valid VisAIbility backup.');
            console.error(error);
          }
        };
        reader.readAsText(file);
      };

      const dashboardData = currentProject ? getDashboardData() : null;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
          <div className="max-w-6xl mx-auto">
            <div className="text-center mb-8">
              <h1 className="text-4xl font-bold text-indigo-900 mb-2">VisAIbility Tool</h1>
              <p className="text-gray-600">Track your brand's visibility across AI platforms</p>
            </div>

            {currentProject && screen !== 'projects' && (
              <div className="bg-white rounded-lg shadow-md p-4 mb-6">
                <div className="flex justify-between items-center mb-4">
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => setScreen('projects')}
                      className="text-indigo-600 hover:text-indigo-700 font-medium"
                    >
                      ← All Projects
                    </button>
                    <span className="text-gray-400">|</span>
                    <h2 className="text-lg font-semibold text-gray-800">{currentProject.name}</h2>
                  </div>
                </div>
                
                <div className="flex gap-2">
                  <button
                    onClick={() => setScreen('prompts')}
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${
                      screen === 'prompts'
                        ? 'bg-indigo-600 text-white'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    Prompts
                  </button>
                  <button
                    onClick={() => setScreen('log')}
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${
                      screen === 'log'
                        ? 'bg-indigo-600 text-white'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                    disabled={currentProject.prompts.length === 0}
                  >
                    Log Results
                  </button>
                  <button
                    onClick={() => setScreen('dashboard')}
                    className={`px-4 py-2 rounded-md font-medium transition-colors ${
                      screen === 'dashboard'
                        ? 'bg-indigo-600 text-white'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                    disabled={currentProject.logs.length === 0}
                  >
                    Dashboard
                  </button>
                </div>
              </div>
            )}

            {screen === 'projects' && (
              <div className="bg-white rounded-lg shadow-md p-8">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-gray-800">Your Projects</h2>
                  <div className="flex gap-2">
                    <label className="flex items-center gap-2 bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors cursor-pointer">
                      <Download className="w-4 h-4" />
                      Import Backup
                      <input
                        type="file"
                        accept=".json"
                        onChange={importData}
                        className="hidden"
                      />
                    </label>
                    <button
                      onClick={exportAllData}
                      className="flex items-center gap-2 bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors"
                      disabled={projects.length === 0}
                    >
                      <Download className="w-4 h-4" />
                      Export All
                    </button>
                    <button
                      onClick={() => setScreen('setup')}
                      className="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors"
                    >
                      <Plus className="w-4 h-4" />
                      New Project
                    </button>
                  </div>
                </div>

                {projects.length === 0 ? (
                  <div className="text-center py-12">
                    <p className="text-gray-600 mb-4">No projects yet. Create your first project to start tracking!</p>
                    <button
                      onClick={() => setScreen('setup')}
                      className="bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700 transition-colors"
                    >
                      Create First Project
                    </button>
                  </div>
                ) : (
                  <div>
                    <div className="mb-4 p-3 bg-blue-50 border-l-4 border-blue-500 text-blue-800 text-sm">
                      <strong>💾 Backup your data:</strong> Click "Export All" to save all your projects. You can import this file later to restore your data or share it with another device.
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {projects.map(project => (
                        <div
                          key={project.id}
                          className="border border-gray-200 rounded-lg p-6 hover:border-indigo-300 transition-colors cursor-pointer"
                          onClick={() => {
                            setCurrentProjectId(project.id);
                            setScreen('prompts');
                          }}
                        >
                          <div className="flex justify-between items-start mb-3">
                            <h3 className="text-lg font-semibold text-gray-800">{project.name}</h3>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                if (confirm('Delete this project? This cannot be undone.')) {
                                  deleteProject(project.id);
                                }
                              }}
                              className="text-red-500 hover:text-red-700"
                            >
                              <Trash2 className="w-4 h-4" />
                            </button>
                          </div>
                          <p className="text-sm text-gray-600 mb-2">{project.brandName} • {project.productDescription}</p>
                          <div className="flex gap-4 text-xs text-gray-500">
                            <span>{project.prompts.length} prompts</span>
                            <span>{project.logs.length} logs</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {screen === 'setup' && (
              <div className="bg-white rounded-lg shadow-md p-8">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-2xl font-bold text-gray-800">Create New Project</h2>
                  <button
                    onClick={() => {
                      setScreen('projects');
                      setNewProject({
                        name: '',
                        brandName: '',
                        productDescription: '',
                        industry: 'fashion',
                        competitors: ['', '', '']
                      });
                    }}
                    className="text-gray-600 hover:text-gray-800"
                  >
                    Cancel
                  </button>
                </div>
                <div className="mb-6 p-3 bg-indigo-50 border-l-4 border-indigo-500 text-indigo-800 text-sm">
                  <strong>Getting started:</strong> Enter your project details below, then we'll generate test prompts →
                </div>
                
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Project Name *
                    </label>
                    <input
                      type="text"
                      value={newProject.name}
                      onChange={(e) => setNewProject({ ...newProject, name: e.target.value })}
                      className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                      placeholder="e.g., Blue Bottle - Cold Brew, Nike - Running Shoes"
                    />
                    <p className="mt-1 text-xs text-gray-500">
                      Give this project a memorable name
                    </p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Brand Name *
                    </label>
                    <input
                      type="text"
                      value={newProject.brandName}
                      onChange={(e) => setNewProject({ ...newProject, brandName: e.target.value })}
                      className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                      placeholder="e.g., Blue Bottle Coffee, Nike, Shopify"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      What does your brand sell? *
                    </label>
                    <input
                      type="text"
                      value={newProject.productDescription}
                      onChange={(e) => setNewProject({ ...newProject, productDescription: e.target.value })}
                      className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                      placeholder="e.g., cold brew coffee, running shoes, project management software"
                    />
                    <p className="mt-1 text-xs text-gray-500">
                      Be specific! This helps generate relevant prompts.
                    </p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Industry Category *
                    </label>
                    <select
                      value={newProject.industry}
                      onChange={(e) => setNewProject({ ...newProject, industry: e.target.value })}
                      className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                      <option value="fashion">Fashion & Apparel</option>
                      <option value="home">Home & Furniture</option>
                      <option value="electronics">Electronics & Tech</option>
                      <option value="grocery">Food & Grocery</option>
                      <option value="beauty">Health & Beauty</option>
                      <option value="sports">Sports & Outdoors</option>
                      <option value="saas">SaaS / Software</option>
                      <option value="services">Professional Services</option>
                    </select>
                    <p className="mt-1 text-xs text-gray-500">
                      General category for context only
                    </p>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Competitors (up to 3)
                    </label>
                    {newProject.competitors.map((comp, idx) => (
                      <input
                        key={idx}
                        type="text"
                        value={comp}
                        onChange={(e) => {
                          const newComps = [...newProject.competitors];
                          newComps[idx] = e.target.value;
                          setNewProject({ ...newProject, competitors: newComps });
                        }}
                        className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-2"
                        placeholder={`Competitor ${idx + 1}`}
                      />
                    ))}
                  </div>

                  <button
                    onClick={createProject}
                    disabled={!newProject.name || !newProject.brandName || !newProject.productDescription}
                    className="w-full bg-indigo-600 text-white px-6 py-3 rounded-md font-medium hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                  >
                    Create Project & Generate Prompts
                  </button>
                </div>
              </div>
            )}

            {screen === 'prompts' && currentProject && (
              <div className="bg-white rounded-lg shadow-md p-8">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Test Prompts</h2>
                <div className="mb-6 p-3 bg-indigo-50 border-l-4 border-indigo-500 text-indigo-800 text-sm">
                  <strong>Next step:</strong> Copy these prompts and test them across AI platforms (ChatGPT, Claude, Perplexity, Google AI). Then head to "Log Results" to track what you find →
                </div>

                <div className="space-y-4 mb-6">
                  {currentProject.prompts.map((prompt) => (
                    <div key={prompt.id} className="border border-gray-200 rounded-lg p-4 hover:border-indigo-300 transition-colors">
                      <div className="flex justify-between items-start mb-2">
                        <span className={`text-xs font-semibold uppercase ${
                          prompt.isCustom ? 'text-purple-600' : 'text-indigo-600'
                        }`}>
                          {prompt.isCustom ? 'custom' : prompt.category}
                        </span>
                        <div className="flex gap-2">
                          <button
                            onClick={() => navigator.clipboard.writeText(prompt.text)}
                            className="text-sm text-gray-500 hover:text-indigo-600"
                          >
                            Copy
                          </button>
                          <button
                            onClick={() => setEditingPrompt(prompt.id)}
                            className="text-sm text-gray-500 hover:text-indigo-600"
                          >
                            Edit
                          </button>
                          <button
                            onClick={() => {
                              if (confirm('Delete this prompt?')) {
                                deletePrompt(prompt.id);
                              }
                            }}
                            className="text-sm text-red-500 hover:text-red-700"
                          >
                            Delete
                          </button>
                        </div>
                      </div>
                      
                      {editingPrompt === prompt.id ? (
                        <div className="space-y-2">
                          <textarea
                            defaultValue={prompt.text}
                            className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                            rows={2}
                            id={`edit-${prompt.id}`}
                          />
                          <div className="flex gap-2">
                            <button
                              onClick={() => {
                                const newText = document.getElementById(`edit-${prompt.id}`).value;
                                updatePrompt(prompt.id, newText);
                              }}
                              className="px-3 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700"
                            >
                              Save
                            </button>
                            <button
                              onClick={() => setEditingPrompt(null)}
                              className="px-3 py-1 bg-gray-200 text-gray-700 text-sm rounded hover:bg-gray-300"
                            >
                              Cancel
                            </button>
                          </div>
                        </div>
                      ) : (
                        <p className="text-gray-800">{prompt.text}</p>
                      )}
                    </div>
                  ))}
                </div>

                <div className="border-2 border-dashed border-gray-300 rounded-lg p-6">
                  <h3 className="font-semibold text-gray-800 mb-3">Add Custom Prompt</h3>
                  <textarea
                    id="custom-prompt-input"
                    className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 mb-3"
                    rows={2}
                    placeholder="Enter your own test prompt..."
                  />
                  <button
                    onClick={() => {
                      const input = document.getElementById('custom-prompt-input');
                      addCustomPrompt(input.value);
                      input.value = '';
                    }}
                    className="bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition-colors"
                  >
                    Add Custom Prompt
                  </button>
                </div>

                <div className="mt-6 p-4 bg-blue-50 rounded-lg">
                  <h3 className="font-semibold text-blue-900 mb-2">How to use these prompts:</h3>
                  <ol className="text-sm text-blue-800 space-y-1 list-decimal list-inside">
                    <li>Copy a prompt from above</li>
                    <li>Paste it into ChatGPT, Claude, or other AI platforms</li>
                    <li>Take note of which brands are mentioned</li>
                    <li>Go to "Log Results" tab and paste the AI's response</li>
                    <li>Repeat weekly to track trends</li>
                  </ol>
                </div>
              </div>
            )}

            {screen === 'log' && currentProject && (
              <div className="bg-white rounded-lg shadow-md p-8">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Log AI Response</h2>
                <div className="mb-6 p-3 bg-indigo-50 border-l-4 border-indigo-500 text-indigo-800 text-sm">
                  <strong>Track your data:</strong> Paste AI responses below. After logging a few entries, check your Dashboard to see trends →
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-base font-bold text-gray-900 mb-2">
                      ⚠️ Which AI Platform? *
                    </label>
                    <select
                      value={currentLog.platform}
                      onChange={(e) => setCurrentLog({ ...currentLog, platform: e.target.value })}
                      className="w-full px-4 py-3 text-lg border-2 border-indigo-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-indigo-50"
                    >
                      <option value="">⚠️ SELECT PLATFORM FIRST</option>
                      <option value="ChatGPT">💬 ChatGPT</option>
                      <option value="Claude">🤖 Claude</option>
                      <option value="Perplexity">🔍 Perplexity</option>
                      <option value="Google AI Overviews">🔎 Google AI Overviews</option>
                      <option value="Gemini">✨ Gemini</option>
                    </select>
                    <p className="mt-1 text-sm text-red-600 font-medium">
                      Don't forget to change this for each platform you test!
                    </p>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Date</label>
                      <input
                        type="date"
                        value={currentLog.date}
                        onChange={(e) => setCurrentLog({ ...currentLog, date: e.target.value })}
                        className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Prompt Used</label>
                      <select
                        value={currentLog.promptId || ''}
                        onChange={(e) => setCurrentLog({ ...currentLog, promptId: parseInt(e.target.value) })}
                        className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="">Select a prompt...</option>
                        {currentProject.prompts.map((prompt) => (
                          <option key={prompt.id} value={prompt.id}>
                            {prompt.text.substring(0, 50)}{prompt.text.length > 50 ? '...' : ''}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      AI Response (paste full response)
                    </label>
                    <textarea
                      value={currentLog.response}
                      onChange={(e) => setCurrentLog({ ...currentLog, response: e.target.value })}
                      rows={8}
                      className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 font-mono text-sm"
                      placeholder="Paste the full AI response here..."
                    />
                  </div>

                  <button
                    onClick={addLog}
                    disabled={!currentLog.response || !currentLog.promptId || !currentLog.platform}
                    className="w-full bg-indigo-600 text-white px-6 py-3 rounded-md font-medium hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                  >
                    Save Entry
                  </button>
                </div>

                {currentProject.logs.length > 0 && (
                  <div className="mt-8">
                    <h3 className="text-lg font-semibold text-gray-800 mb-4">Recent Entries ({currentProject.logs.length})</h3>
                    <div className="space-y-2 max-h-64 overflow-y-auto">
                      {currentProject.logs.slice(-5).reverse().map((log) => (
                        <div key={log.id} className="border border-gray-200 rounded p-3 text-sm">
                          <div className="flex justify-between text-gray-600 mb-1">
                            <span>{log.date}</span>
                            <span>{log.platform}</span>
                          </div>
                          <div className="text-gray-800 font-medium">
                            Mentions: {Object.entries(log.mentions)
                              .filter(([_, count]) => count > 0)
                              .map(([brand, count]) => `${brand} (${count})`)
                              .join(', ') || 'None detected'}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {screen === 'dashboard' && currentProject && dashboardData && (
              <div className="space-y-6">
                <div className="p-3 bg-green-50 border-l-4 border-green-500 text-green-800 text-sm">
                  <strong>Keep tracking:</strong> Come back weekly to log new results and watch your AI visibility trends over time. Consistent tracking reveals patterns!
                </div>

                <div className="bg-white rounded-lg shadow-md p-4 flex justify-between items-center">
                  <div>
                    <h3 className="font-semibold text-gray-800">Total Entries: {currentProject.logs.length}</h3>
                    <p className="text-sm text-gray-600">Tracking since {currentProject.logs[0]?.date}</p>
                  </div>
                  <button
                    onClick={exportData}
                    className="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors"
                  >
                    <Download className="w-4 h-4" />
                    Export CSV
                  </button>
                </div>

                <div className="bg-white rounded-lg shadow-md p-6">
                  <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <TrendingUp className="w-5 h-5 text-indigo-600" />
                    Mention Trends Over Time
                  </h3>
                  <ResponsiveContainer width="100%" height={300}>
                    <LineChart data={dashboardData.timeline}>
                      <CartesianGrid strokeDasharray="3 3" />
                      <XAxis dataKey="date" />
                      <YAxis />
                      <Tooltip />
                      <Legend />
                      <Line type="monotone" dataKey={currentProject.brandName} stroke="#4f46e5" strokeWidth={2} />
                      {currentProject.competitors.map((comp, idx) => (
                        <Line
                          key={comp}
                          type="monotone"
                          dataKey={comp}
                          stroke={['#10b981', '#f59e0b', '#ef4444'][idx]}
                          strokeWidth={2}
                        />
                      ))}
                    </LineChart>
                  </ResponsiveContainer>
                </div>

                <div className="bg-white rounded-lg shadow-md p-6">
                  <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <BarChart3 className="w-5 h-5 text-indigo-600" />
                    Visibility by Platform
                  </h3>
                  <ResponsiveContainer width="100%" height={300}>
                    <BarChart data={dashboardData.platforms}>
                      <CartesianGrid strokeDasharray="3 3" />
                      <XAxis dataKey="platform" />
                      <YAxis />
                      <Tooltip />
                      <Legend />
                      <Bar dataKey={currentProject.brandName} fill="#4f46e5" />
                      {currentProject.competitors.map((comp, idx) => (
                        <Bar
                          key={comp}
                          dataKey={comp}
                          fill={['#10b981', '#f59e0b', '#ef4444'][idx]}
                        />
                      ))}
                    </BarChart>
                  </ResponsiveContainer>
                </div>

                <div className="grid grid-cols-3 gap-4">
                  {[currentProject.brandName, ...currentProject.competitors].map((brand) => {
                    const totalMentions = currentProject.logs.reduce((sum, log) => sum + (log.mentions[brand] || 0), 0);
                    return (
                      <div key={brand} className="bg-white rounded-lg shadow-md p-6">
                        <h4 className="text-sm font-medium text-gray-600 mb-1">{brand}</h4>
                        <p className="text-3xl font-bold text-indigo-600">{totalMentions}</p>
                        <p className="text-xs text-gray-500 mt-1">total mentions</p>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="mt-8 text-center text-sm text-gray-600">
              <p>Built with ❤️ for the SEO/GEO community | Free to use | Happy Holidays 2025</p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<VisAIbilityTool />, document.getElementById('root'));
  </script>
</body>
</html>
