<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisAIbility Tool - Track Your Brand's AI Visibility</title>
  <meta name="description" content="Free tool to track your brand's visibility across AI platforms like ChatGPT, Claude, Perplexity, and Google AI Overviews">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X2HVLLE707"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X2HVLLE707');
  </script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icon components
    const Plus = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
      </svg>
    );

    const Trash2 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const Download = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const TrendingUp = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
    );

    const BarChart3 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    );

    function VisAIbilityTool() {
      const [screen, setScreen] = useState('projects');
      const [projects, setProjects] = useState([]);
      const [currentProjectId, setCurrentProjectId] = useState(null);
      const [editingPrompt, setEditingPrompt] = useState(null);
      
      const [newProject, setNewProject] = useState({
        name: '',
        brandName: '',
        productDescription: '',
        industry: 'fashion',
        competitors: ['', '', '']
      });

      const [currentLog, setCurrentLog] = useState({
        date: new Date().toISOString().split('T')[0],
        platform: '',
        promptId: null,
        response: '',
        mentions: {}
      });

      useEffect(() => {
        const saved = localStorage.getItem('visaibility-projects');
        if (saved) {
          const data = JSON.parse(saved);
          setProjects(data.projects || []);
          setCurrentProjectId(data.currentProjectId || null);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('visaibility-projects', JSON.stringify({
          projects,
          currentProjectId
        }));
      }, [projects, currentProjectId]);

      const currentProject = projects.find(p => p.id === currentProjectId);

      const createProject = () => {
        const project = {
          id: Date.now(),
          name: newProject.name,
          brandName: newProject.brandName,
          productDescription: newProject.productDescription,
          industry: newProject.industry,
          competitors: newProject.competitors.filter(c => c.trim()),
          prompts: generateInitialPrompts(newProject),
          logs: [],
          createdAt: new Date().toISOString()
        };
        
        setProjects([...projects, project]);
        setCurrentProjectId(project.id);
        setNewProject({
          name: '',
          brandName: '',
          productDescription: '',
          industry: 'fashion',
          competitors: ['', '', '']
        });
        setScreen('prompts');
      };

      const generateInitialPrompts = (projectData) => {
        const { brandName, productDescription, competitors } = projectData;
        const product = productDescription || 'products';
        const comp = competitors.find(c => c.trim());
        
        return [
          {
            id: 1,
            text: `What are the best ${product} to buy online?`,
            category: 'general',
            isCustom: false
          },
          {
            id: 2,
            text: comp 
              ? `Compare ${brandName} to ${comp} for ${product}`
              : `What makes ${brandName} different from other ${product} brands?`,
            category: 'brand-specific',
            isCustom: false
          },
          {
            id: 3,
            text: `Which brands are known for high-quality ${product}?`,
            category: 'general',
            isCustom: false
          },
          {
            id: 4,
            text: `What do experts recommend for ${product}?`,
            category: 'general',
            isCustom: false
          },
          {
            id: 5,
            text: `What are the most popular ${product} brands in 2025?`,
            category: 'general',
            isCustom: false
          }
        ];
      };

      const addCustomPrompt = (promptText) => {
        if (!currentProject || !promptText.trim()) return;
        
        const newPrompt = {
          id: Date.now(),
          text: promptText,
          category: 'custom',
          isCustom: true
        };
        
        const updatedProjects = projects.map(p => 
          p.id === currentProjectId 
            ? { ...p, prompts: [...p.prompts, newPrompt] }
            : p
        );
        
        setProjects(updatedProjects);
      };

      const updatePrompt = (promptId, newText) => {
        const updatedProjects = projects.map(p =>
          p.id === currentProjectId
            ? {
                ...p,
                prompts: p.prompts.map(prompt =>
                  prompt.id === promptId ? { ...prompt, text: newText } : prompt
                )
              }
            : p
        );
        setProjects(updatedProjects);
        setEditingPrompt(null);
      };

      const deletePrompt = (promptId) => {
        const updatedProjects = projects.map(p =>
          p.id === currentProjectId
            ? { ...p, prompts: p.prompts.filter(prompt => prompt.id !== promptId) }
            : p
        );
        setProjects(updatedProjects);
      };

      const analyzeResponse = (response) => {
        if (!currentProject) return {};
        
        const mentions = {};
        const allBrands = [currentProject.brandName, ...currentProject.competitors];
        
        allBrands.forEach(brand => {
          if (!brand) return;
          const regex = new RegExp(brand, 'gi');
          const matches = response.match(regex);
          mentions[brand] = matches ? matches.length : 0;
        });
        
        return mentions;
      };

      const addLog = () => {
        if (!currentProject || !currentLog.response || !currentLog.promptId || !currentLog.platform) return;
        
        const mentions = analyzeResponse(currentLog.response);
        
        const log = {
          id: Date.now(),
          date: currentLog.date,
          platform: currentLog.platform,
          promptId: currentLog.promptId,
          response: currentLog.response,
          mentions,
          createdAt: new Date().toISOString()
        };
        
        const updatedProjects = projects.map(p =>
          p.id === currentProjectId
            ? { ...p, logs: [...p.logs, log] }
            : p
        );
        
        setProjects(updatedProjects);
        setCurrentLog({
          date: new Date().toISOString().split('T')[0],
          platform: '',
          promptId: null,
          response: '',
          mentions: {}
        });
      };

      const exportData = () => {
        if (!currentProject) return;
        
        let csv = 'Date,Platform,Prompt,Your Brand,';
        csv += currentProject.competitors.join(',') + '\n';
        
        currentProject.logs.forEach(log => {
          const prompt = currentProject.prompts.find(p => p.id === log.promptId);
          const promptText = prompt ? prompt.text.replace(/,/g, ';') : 'Unknown';
          
          csv += `${log.date},${log.platform},"${promptText}",`;
          csv += `${log.mentions[currentProject.brandName] || 0},`;
          csv += currentProject.competitors.map(c => log.mentions[c] || 0).join(',');
          csv += '\n';
        });
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentProject.name}-visibility-data.csv`;
        a.click();
      };

      const deleteProject = (projectId) => {
        if (confirm('Are you sure you want to delete this project? This cannot be undone.')) {
          setProjects(projects.filter(p => p.id !== projectId));
          if (currentProjectId === projectId) {
            setCurrentProjectId(null);
            setScreen('projects');
          }
        }
      };

      const dashboardData = currentProject ? {
        totalMentions: currentProject.logs.reduce((acc, log) => {
          return acc + Object.values(log.mentions).reduce((sum, count) => sum + count, 0);
        }, 0),
        byBrand: [currentProject.brandName, ...currentProject.competitors].map(brand => ({
          brand,
          total: currentProject.logs.reduce((sum, log) => sum + (log.mentions[brand] || 0), 0)
        })),
        byPlatform: ['ChatGPT', 'Claude', 'Perplexity', 'Google AI Overviews', 'Gemini'].map(platform => ({
          platform,
          ...Object.fromEntries(
            [currentProject.brandName, ...currentProject.competitors].map(brand => [
              brand,
              currentProject.logs
                .filter(log => log.platform === platform)
                .reduce((sum, log) => sum + (log.mentions[brand] || 0), 0)
            ])
          )
        }))
      } : null;

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
          <div className="max-w-6xl mx-auto p-6">
            <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
              <h1 className="text-4xl font-bold text-gray-800 mb-2">VisAIbility Tool</h1>
              <p className="text-gray-600">Track your brand's visibility across AI platforms</p>
            </div>

            {!currentProject && screen === 'projects' && (
              <div className="space-y-6">
                <div className="bg-white rounded-lg shadow-md p-6">
                  <h2 className="text-2xl font-bold text-gray-800 mb-4">Create New Project</h2>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Project Name</label>
                      <input
                        type="text"
                        value={newProject.name}
                        onChange={(e) => setNewProject({...newProject, name: e.target.value})}
                        className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                        placeholder="e.g., Q1 2025 Campaign"
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Your Brand Name</label>
                      <input
                        type="text"
                        value={newProject.brandName}
                        onChange={(e) => setNewProject({...newProject, brandName: e.target.value})}
                        className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                        placeholder="e.g., Acme Corp"
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Product/Service Description</label>
                      <input
                        type="text"
                        value={newProject.productDescription}
                        onChange={(e) => setNewProject({...newProject, productDescription: e.target.value})}
                        className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                        placeholder="e.g., organic skincare products"
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">Competitors (up to 3)</label>
                      {newProject.competitors.map((comp, idx) => (
                        <input
                          key={idx}
                          type="text"
                          value={comp}
                          onChange={(e) => {
                            const newComps = [...newProject.competitors];
                            newComps[idx] = e.target.value;
                            setNewProject({...newProject, competitors: newComps});
                          }}
                          className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 mb-2"
                          placeholder={`Competitor ${idx + 1}`}
                        />
                      ))}
                    </div>
                    
                    <button
                      onClick={createProject}
                      disabled={!newProject.name || !newProject.brandName}
                      className="w-full bg-indigo-600 text-white px-6 py-3 rounded-md font-medium hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                    >
                      Create Project
                    </button>
                  </div>
                </div>

                {projects.length > 0 && (
                  <div className="bg-white rounded-lg shadow-md p-6">
                    <h2 className="text-2xl font-bold text-gray-800 mb-4">Your Projects</h2>
                    <div className="space-y-3">
                      {projects.map(project => (
                        <div key={project.id} className="border border-gray-200 rounded p-4 flex justify-between items-center hover:bg-gray-50">
                          <div>
                            <h3 className="font-semibold text-gray-800">{project.name}</h3>
                            <p className="text-sm text-gray-600">{project.brandName} • {project.logs.length} entries</p>
                          </div>
                          <div className="flex gap-2">
                            <button
                              onClick={() => {
                                setCurrentProjectId(project.id);
                                setScreen('prompts');
                              }}
                              className="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors"
                            >
                              Open
                            </button>
                            <button
                              onClick={() => deleteProject(project.id)}
                              className="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition-colors"
                            >
                              Delete
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {currentProject && (
              <div className="space-y-6">
                <div className="bg-white rounded-lg shadow-md p-4 flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-semibold text-gray-800">{currentProject.name}</h2>
                    <p className="text-sm text-gray-600">{currentProject.brandName}</p>
                  </div>
                  <button
                    onClick={() => {
                      setCurrentProjectId(null);
                      setScreen('projects');
                    }}
                    className="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors"
                  >
                    Back to Projects
                  </button>
                </div>

                <div className="bg-white rounded-lg shadow-md p-4 flex gap-2">
                  <button
                    onClick={() => setScreen('prompts')}
                    className={`flex-1 px-4 py-2 rounded-md font-medium transition-colors ${
                      screen === 'prompts'
                        ? 'bg-indigo-600 text-white'
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    Prompts
                  </button>
                  <button
                    onClick={() => setScreen('track')}
                    className={`flex-1 px-4 py-2 rounded-md font-medium transition-colors ${
                      screen === 'track'
                        ? 'bg-indigo-600 text-white'
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    Track
                  </button>
                  <button
                    onClick={() => setScreen('dashboard')}
                    className={`flex-1 px-4 py-2 rounded-md font-medium transition-colors ${
                      screen === 'dashboard'
                        ? 'bg-indigo-600 text-white'
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                    }`}
                  >
                    Dashboard
                  </button>
                </div>

                {screen === 'prompts' && (
                  <div className="bg-white rounded-lg shadow-md p-6">
                    <h3 className="text-xl font-bold text-gray-800 mb-4">Test Prompts</h3>
                    <p className="text-gray-600 mb-4">Copy these prompts and paste them into AI platforms to test your brand visibility.</p>
                    
                    <div className="space-y-3 mb-6">
                      {currentProject.prompts.map((prompt) => (
                        <div key={prompt.id} className="border border-gray-200 rounded p-4">
                          {editingPrompt === prompt.id ? (
                            <div className="space-y-2">
                              <textarea
                                defaultValue={prompt.text}
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                                rows={3}
                                onBlur={(e) => updatePrompt(prompt.id, e.target.value)}
                                autoFocus
                              />
                              <button
                                onClick={() => setEditingPrompt(null)}
                                className="text-sm text-indigo-600 hover:text-indigo-800"
                              >
                                Done
                              </button>
                            </div>
                          ) : (
                            <div className="flex justify-between items-start">
                              <div className="flex-1">
                                <p className="text-gray-800">{prompt.text}</p>
                                <span className="text-xs text-gray-500 mt-1 inline-block">
                                  {prompt.category}
                                </span>
                              </div>
                              <div className="flex gap-2 ml-4">
                                <button
                                  onClick={() => {
                                    navigator.clipboard.writeText(prompt.text);
                                    alert('Copied to clipboard!');
                                  }}
                                  className="text-indigo-600 hover:text-indigo-800 text-sm font-medium"
                                >
                                  Copy
                                </button>
                                {prompt.isCustom && (
                                  <>
                                    <button
                                      onClick={() => setEditingPrompt(prompt.id)}
                                      className="text-gray-600 hover:text-gray-800 text-sm font-medium"
                                    >
                                      Edit
                                    </button>
                                    <button
                                      onClick={() => deletePrompt(prompt.id)}
                                      className="text-red-600 hover:text-red-800 text-sm font-medium"
                                    >
                                      Delete
                                    </button>
                                  </>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    <div className="border-t border-gray-200 pt-4">
                      <h4 className="font-semibold text-gray-800 mb-3">Add Custom Prompt</h4>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          id="customPrompt"
                          className="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          placeholder="Enter your custom prompt..."
                          onKeyPress={(e) => {
                            if (e.key === 'Enter') {
                              addCustomPrompt(e.target.value);
                              e.target.value = '';
                            }
                          }}
                        />
                        <button
                          onClick={() => {
                            const input = document.getElementById('customPrompt');
                            addCustomPrompt(input.value);
                            input.value = '';
                          }}
                          className="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition-colors flex items-center gap-2"
                        >
                          <Plus className="w-5 h-5" />
                          Add
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {screen === 'track' && (
                  <div className="bg-white rounded-lg shadow-md p-6">
                    <h3 className="text-xl font-bold text-gray-800 mb-4">Log AI Response</h3>
                    
                    <div className="space-y-4">
                      <div className="p-4 bg-yellow-50 border-l-4 border-yellow-500 text-yellow-800 text-sm">
                        <strong>Important:</strong> Paste the complete AI response below. The tool will automatically count brand mentions for you.
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">AI Platform *</label>
                        <select
                          value={currentLog.platform}
                          onChange={(e) => setCurrentLog({ ...currentLog, platform: e.target.value })}
                          className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                        >
                          <option value="">⚠️ SELECT PLATFORM FIRST</option>
                          <option value="ChatGPT">💬 ChatGPT</option>
                          <option value="Claude">🤖 Claude</option>
                          <option value="Perplexity">🔍 Perplexity</option>
                          <option value="Google AI Overviews">🔎 Google AI Overviews</option>
                          <option value="Gemini">✨ Gemini</option>
                        </select>
                        <p className="mt-1 text-sm text-red-600 font-medium">
                          Don't forget to change this for each platform you test!
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">Date</label>
                          <input
                            type="date"
                            value={currentLog.date}
                            onChange={(e) => setCurrentLog({ ...currentLog, date: e.target.value })}
                            className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">Prompt Used</label>
                          <select
                            value={currentLog.promptId || ''}
                            onChange={(e) => setCurrentLog({ ...currentLog, promptId: parseInt(e.target.value) })}
                            className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500"
                          >
                            <option value="">Select a prompt...</option>
                            {currentProject.prompts.map((prompt) => (
                              <option key={prompt.id} value={prompt.id}>
                                {prompt.text.substring(0, 50)}{prompt.text.length > 50 ? '...' : ''}
                              </option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          AI Response (paste full response)
                        </label>
                        <textarea
                          value={currentLog.response}
                          onChange={(e) => setCurrentLog({ ...currentLog, response: e.target.value })}
                          rows={8}
                          className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 font-mono text-sm"
                          placeholder="Paste the full AI response here..."
                        />
                      </div>

                      <button
                        onClick={addLog}
                        disabled={!currentLog.response || !currentLog.promptId || !currentLog.platform}
                        className="w-full bg-indigo-600 text-white px-6 py-3 rounded-md font-medium hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                      >
                        Save Entry
                      </button>
                    </div>

                    {currentProject.logs.length > 0 && (
                      <div className="mt-8">
                        <h3 className="text-lg font-semibold text-gray-800 mb-4">Recent Entries ({currentProject.logs.length})</h3>
                        <div className="space-y-2 max-h-64 overflow-y-auto">
                          {currentProject.logs.slice(-5).reverse().map((log) => (
                            <div key={log.id} className="border border-gray-200 rounded p-3 text-sm">
                              <div className="flex justify-between text-gray-600 mb-1">
                                <span>{log.date}</span>
                                <span>{log.platform}</span>
                              </div>
                              <div className="text-gray-800 font-medium">
                                Mentions: {Object.entries(log.mentions)
                                  .filter(([_, count]) => count > 0)
                                  .map(([brand, count]) => `${brand} (${count})`)
                                  .join(', ') || 'None detected'}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {screen === 'dashboard' && currentProject && dashboardData && (
                  <div className="space-y-6">
                    <div className="p-3 bg-green-50 border-l-4 border-green-500 text-green-800 text-sm">
                      <strong>Keep tracking:</strong> Come back weekly to log new results and watch your AI visibility trends over time. Consistent tracking reveals patterns!
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-4 flex justify-between items-center">
                      <div>
                        <h3 className="font-semibold text-gray-800">Total Entries: {currentProject.logs.length}</h3>
                        <p className="text-sm text-gray-600">Tracking since {currentProject.logs[0]?.date}</p>
                      </div>
                      <button
                        onClick={exportData}
                        className="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors"
                      >
                        <Download className="w-4 h-4" />
                        Export CSV
                      </button>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6">
                      <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <TrendingUp className="w-5 h-5 text-indigo-600" />
                        Total Mentions by Brand
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {dashboardData.byBrand.map((item) => (
                          <div key={item.brand} className="bg-gray-50 rounded-lg p-4 border border-gray-200">
                            <h4 className="text-sm font-medium text-gray-600 mb-1">{item.brand}</h4>
                            <p className="text-3xl font-bold text-indigo-600">{item.total}</p>
                            <p className="text-xs text-gray-500 mt-1">total mentions</p>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md p-6">
                      <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <BarChart3 className="w-5 h-5 text-indigo-600" />
                        Mentions by Platform
                      </h3>
                      <div className="overflow-x-auto">
                        <table className="w-full">
                          <thead>
                            <tr className="border-b border-gray-200">
                              <th className="text-left py-2 px-3 text-sm font-semibold text-gray-700">Platform</th>
                              {[currentProject.brandName, ...currentProject.competitors].map(brand => (
                                <th key={brand} className="text-center py-2 px-3 text-sm font-semibold text-gray-700">{brand}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {dashboardData.byPlatform.map((row) => (
                              <tr key={row.platform} className="border-b border-gray-100 hover:bg-gray-50">
                                <td className="py-3 px-3 text-sm text-gray-800">{row.platform}</td>
                                {[currentProject.brandName, ...currentProject.competitors].map(brand => (
                                  <td key={brand} className="text-center py-3 px-3 text-sm font-medium text-gray-700">
                                    {row[brand] || 0}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                <div className="mt-8 text-center text-sm text-gray-600">
                  <p>Built with ❤️ for the SEO/GEO community | Free to use | Happy Holidays 2025</p>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<VisAIbilityTool />, document.getElementById('root'));
  </script>
</body>
</html>
